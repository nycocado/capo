services:
  nginx:
    image: nginx:alpine
    container_name: capo-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_PORT}:80'
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - capo-network

  db:
    image: mariadb:lts
    container_name: capo-db
    restart: unless-stopped
    ports:
      - '${MARIADB_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/01-create.sql:/docker-entrypoint-initdb.d/01-create.sql
      - ./db/02-insert.sql:/docker-entrypoint-initdb.d/02-insert.sql
    networks:
      - capo-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: capo-api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./api/.env.local
    environment:
      DATABASE_HOST: ${MARIADB_HOST}
      DATABASE_PORT: ${MARIADB_PORT}
      DATABASE_USER: ${MARIADB_USER}
      DATABASE_PASSWORD: ${MARIADB_PASSWORD}
      DATABASE_NAME: ${MARIADB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_INTERNAL_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./api:/app
      - ./api/storage:/app/storage
      - /app/node_modules
    networks:
      - capo-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: capo-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./web/.env.local
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./web:/app
      - /app/node_modules
    networks:
      - capo-network

volumes:
  mariadb_data:
    driver: local

networks:
  capo-network:
    driver: bridge
