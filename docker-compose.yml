services:
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: capo-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_PORT}:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    networks:
      - capo-network

  db:
    image: docker.io/library/mariadb:lts
    container_name: capo-db
    restart: unless-stopped
    ports:
      - '${MARIADB_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/01-create.sql:/docker-entrypoint-initdb.d/01-create.sql:ro,Z
      - ./db/02-insert.sql:/docker-entrypoint-initdb.d/02-insert.sql:ro,Z
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - capo-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: capo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env.local
    environment:
      DATABASE_HOST: ${MARIADB_HOST}
      DATABASE_PORT: 3306
      DATABASE_USER: ${MARIADB_USER}
      DATABASE_PASSWORD: ${MARIADB_PASSWORD}
      DATABASE_NAME: ${MARIADB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PORT: ${API_INTERNAL_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - api_storage:/app/storage
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${API_INTERNAL_PORT}/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - capo-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: capo-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./web/.env.local
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - capo-network

volumes:
  mariadb_data:
    driver: local
  api_storage:
    driver: local

networks:
  capo-network:
    driver: bridge
